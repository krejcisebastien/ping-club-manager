databases:
  - name: ping-club-manager-db
    databaseName: ping_club_manager
    user: ping_club_manager
    plan: free

services:
  - type: web
    name: ping-club-manager-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ping-club-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production
      # Si Render doit suffixer le nom du service (nom déjà pris sur onrender.com),
      # l'URL réelle différera — corrige alors cette valeur après le premier déploiement.
      - key: CORS_ORIGIN
        value: https://ping-club-manager-web.onrender.com

  - type: web
    name: ping-club-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Si Render doit suffixer le nom du service (nom déjà pris sur onrender.com),
      # l'URL réelle différera — corrige alors cette valeur et redéploie (Vite fige
      # les variables d'environnement au moment du build).
      - key: VITE_API_URL
        value: https://ping-club-manager-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
