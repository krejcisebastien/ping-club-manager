databases:
  - name: pingpong-db
    databaseName: pingpong_club
    user: pingpong
    plan: free

services:
  - type: web
    name: pingpong-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pingpong-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production
      # À renseigner après le premier déploiement avec l'URL publique de pingpong-web
      # (ex. https://pingpong-web.onrender.com), Render ne permet pas toujours de la
      # référencer automatiquement selon la propriété disponible sur ton plan.
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: pingpong-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # À renseigner avec l'URL publique de pingpong-api + "/api"
      # (ex. https://pingpong-api.onrender.com/api) avant le build,
      # car Vite fige les variables d'environnement à la compilation.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
