# Blueprint Render pour UNE instance de ping-club-manager (un club = une
# instance, sa propre base de données, son propre déploiement).
#
# Pour déployer pour un NOUVEAU club à partir de ce même code, voir le guide
# complet dans DEPLOYMENT.md. En résumé, il faut adapter dans ce fichier :
#   - tous les "name:" (préfixe "ping-club-manager" -> "<nom-du-club>")
#   - CORS_ORIGIN et VITE_API_URL, qui se référencent mutuellement par URL
#     onrender.com (à corriger après le premier déploiement si Render a
#     suffixé un nom de service déjà pris)
#   - VITE_CLUB_NAME (et éventuellement VITE_CLUB_ICON) pour personnaliser
#     le nom affiché dans l'application, sans toucher au code

databases:
  - name: ping-club-manager-db
    databaseName: ping_club_manager
    user: ping_club_manager
    plan: free

services:
  - type: web
    name: ping-club-manager-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ping-club-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production
      # Si Render doit suffixer le nom du service (nom déjà pris sur onrender.com),
      # l'URL réelle différera — corrige alors cette valeur après le premier déploiement.
      - key: CORS_ORIGIN
        value: https://ping-club-manager-web.onrender.com
      # Clé API Resend (resend.com) pour l'envoi des emails de
      # réinitialisation de mot de passe — à renseigner manuellement dans le
      # dashboard Render après le premier déploiement (pas de valeur par
      # défaut ici, c'est une clé secrète).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev

  - type: web
    name: ping-club-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Si Render doit suffixer le nom du service (nom déjà pris sur onrender.com),
      # l'URL réelle différera — corrige alors cette valeur et redéploie (Vite fige
      # les variables d'environnement au moment du build).
      - key: VITE_API_URL
        value: https://ping-club-manager-api.onrender.com/api
      # Nom du club affiché dans l'application (titre de l'onglet, écran de
      # connexion, barre latérale). À adapter par instance — aucun changement
      # de code nécessaire.
      - key: VITE_CLUB_NAME
        value: Club Tennis de Table
      # Icône PrimeIcons affichée à côté du nom (optionnel, défaut : pi-star-fill).
      # - key: VITE_CLUB_ICON
      #   value: pi-star-fill
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
