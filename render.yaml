# Blueprint Render de ping-club-manager. L'application est multi-tenant : UN
# seul déploiement (site + API + base) sert tous les clubs, chacun isolé par
# son club (voir DEPLOYMENT.md pour créer un club).
#
# VITE_CLUB_NAME est le nom du PRODUIT affiché avant la connexion ; une fois
# connecté, chaque utilisateur voit le nom de son propre club (en base).

databases:
  - name: ping-club-manager-db
    databaseName: ping_club_manager
    user: ping_club_manager
    # Le plan gratuit expire après 30 jours ; la base a été passée sur ce plan
    # payant pour éviter l'expiration. Garder cette valeur alignée sur le plan
    # réellement actif dans le dashboard Render (sinon le Blueprint refuse de
    # se synchroniser, Render n'autorisant pas de "downgrade" automatique).
    plan: 0.1c-256mb

services:
  - type: web
    name: ping-club-manager-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ping-club-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production
      # Si Render doit suffixer le nom du service (nom déjà pris sur onrender.com),
      # l'URL réelle différera — corrige alors cette valeur après le premier déploiement.
      - key: CORS_ORIGIN
        value: https://ping-club-manager-web.onrender.com
      # Clé API Resend (resend.com) pour l'envoi des emails de
      # réinitialisation de mot de passe — à renseigner manuellement dans le
      # dashboard Render après le premier déploiement (pas de valeur par
      # défaut ici, c'est une clé secrète).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev
      # Création de club en libre-service (/signup). Laisser "false" tant que
      # tu ne veux pas accepter d'inscriptions publiques (voir DEPLOYMENT.md).
      - key: ALLOW_CLUB_SIGNUP
        value: "false"
      # Licences : paiement en ligne Stripe (optionnel, voir DEPLOYMENT.md). Clés
      # secrètes : à renseigner dans le dashboard Render, jamais ici.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Génération d'exercices/plans par IA (console.anthropic.com), optionnel.
      # Sans cette clé, les boutons "Générer avec l'IA" renvoient une erreur
      # explicite plutôt que de planter le service.
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: ping-club-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Si Render doit suffixer le nom du service (nom déjà pris sur onrender.com),
      # l'URL réelle différera — corrige alors cette valeur et redéploie (Vite fige
      # les variables d'environnement au moment du build).
      - key: VITE_API_URL
        value: https://ping-club-manager-api.onrender.com/api
      # Nom du produit affiché avant la connexion (écran de connexion, titre de
      # l'onglet). Le nom du club, lui, vient de la base et s'affiche après
      # connexion.
      - key: VITE_CLUB_NAME
        value: Club Tennis de Table
      # Adresse affichée sur la page Licence pour régler par facture (optionnel).
      # - key: VITE_SUPPORT_EMAIL
      #   value: contact@exemple.be
      # Icône PrimeIcons affichée à côté du nom (optionnel, défaut : pi-star-fill).
      # - key: VITE_CLUB_ICON
      #   value: pi-star-fill
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
