# Site statique (build Vite dans dist/) servi par le buildpack nginx de Scalingo.
# Toute route inconnue renvoie index.html : Vue Router est en mode history.
root /app/dist;

location / {
  try_files $uri $uri/ /index.html;
}

# index.html et le service worker ne doivent pas rester en cache : sinon la
# PWA ne voit pas les nouvelles versions après un déploiement.
location ~ ^/(index\.html|sw\.js|push-sw\.js)$ {
  add_header Cache-Control "no-cache";
}

location = /manifest.webmanifest {
  types { }
  default_type application/manifest+json;
}
